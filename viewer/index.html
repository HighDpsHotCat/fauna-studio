<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 뷰어 · Fauna Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/viewer.css">
  <script type="importmap">
    {"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}
  </script>
  <script type="module" src="/viewer.js"></script>
</head>
<body>
  <header>
    <div class="brand">Fauna Studio</div>
    <span class="page-name">3D 뷰어</span>
    <button id="open" type="button">GLB 열기…</button>
    <input id="file" type="file" accept=".glb" hidden>
  </header>
  <main id="stage">
    <canvas id="canvas" tabindex="0" aria-label="3D 모델. 방향키로 회전하고 더하기와 빼기 키로 확대·축소합니다."></canvas>
    <section class="model-info" aria-label="모델 정보">
      <h1 id="name">3D 모델</h1>
      <p id="stats"></p>
    </section>
    <p id="status" role="status" aria-live="polite">뷰어 준비 중…</p>
  </main>
  <footer>
    <p class="instructions"><span class="mouse"><b>드래그</b> 회전 <i>·</i> <b>휠</b> 확대·축소</span><span class="touch"><b>한 손가락</b> 회전 <i>·</i> <b>두 손가락</b> 확대·축소</span></p>
    <div class="tools" aria-label="카메라 조작">
      <div class="zoom">
        <button id="out" aria-label="축소" title="축소 (−)" disabled>−</button>
        <button id="in" aria-label="확대" title="확대 (+)" disabled>+</button>
      </div>
      <button id="fit" title="처음 시점으로 화면 맞춤 (Home)" disabled>화면 맞춤</button>
    </div>
  </footer>
</body>
</html>
