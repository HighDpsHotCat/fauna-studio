name: macOS build and checks
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Build Cocoa app and C core; run regression tests
        run: bash build_macos.sh
      - name: Verify example mesh and printing exports
        run: |
          build/aaanimal-cli --inspect examples/red-fox-lowpoly-3000.glb
          build/aaanimal-cli --export-stl examples/red-fox-lowpoly-3000.glb build/example.stl
          build/aaanimal-cli --export-step examples/red-fox-lowpoly-3000.glb build/example.step
          build/aaanimal-cli --export-3mf examples/red-fox-lowpoly-3000.glb build/example.3mf
      - name: Launch native window with example model
        run: AAANIMAL_UI_SMOKE="$PWD/build/macos-preview.png" './build/AAAnimal Studio.app/Contents/MacOS/AAAnimal Studio'
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.os }}
          path: build/macos-preview.png
      - name: Verify AI dependency compatibility without downloading models
        if: success() || failure()
        run: |
          python -m pip install -r ai/requirements.txt
          python -m pip check
          python tools/check_runtime.py
          python -m compileall -q ai classifier.py model_cache.py photo_context.py vendor/triposr
